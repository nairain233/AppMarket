name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.2
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
          KEYSTORE_PASS="$(openssl rand -hex 24)"
          KEY_ALIAS="ci-release"
          KEY_PASSWORD="$KEYSTORE_PASS"

          echo "::add-mask::$KEYSTORE_PASS"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 3072 \
            -validity 3650 \
            -dname "CN=AppMarket CI, OU=CI, O=AppMarket, L=Unknown, ST=Unknown, C=US" \
            -noprompt

          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:android:assembleRelease --no-daemon --stacktrace

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/keystore.jks"

      - name: Locate APK and print hashes
        run: |
          set -euo pipefail
          mapfile -d '' -t apks < <(find app/android/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)

          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one release APK, found ${#apks[@]}."
            exit 1
          fi

          APK_FILE="${apks[0]}"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          {
            echo '### Android Release APK'
            echo
            echo "**File:** \`$(basename "$APK_FILE")\`"
            echo
            echo '| Hash | Value |'
            echo '| --- | --- |'
            echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{print $1}')\` |"
            echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{print $1}')\` |"
            echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{print $1}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          archive: false
          retention-days: 30
